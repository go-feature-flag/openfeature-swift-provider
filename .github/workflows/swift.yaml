name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported toolchain and the real floor: OpenFeature Swift SDK
          # 0.6.0 uses trailing commas in parameter lists (SE-0439), which need
          # Swift 6.1 / Xcode 16.3+. Do not add older toolchains back.
          - name: "Swift 6.1 (Xcode 16.4)"
            os: macos-15
            xcode: "16.4"
          # Pinned modern toolchain; owns the coverage upload.
          - name: "Swift 6.2 (Xcode 26.0.1)"
            os: macos-26
            xcode: "26.0.1"
            coverage: true
          # Floating early-warning job: no Xcode pin, uses whatever
          # macos-latest ships. Non-blocking by design.
          - name: "Latest (default Xcode) [early warning, non-blocking]"
            os: macos-latest
            experimental: true
    steps:
      - uses: actions/checkout@v4

      # NOTE: do not use swift-actions/setup-swift here. On macOS it installs a
      # standalone toolchain but not an SDK, so SwiftPM still picks up the SDK
      # from the selected Xcode. That skew is what broke this workflow: a Swift
      # 5.10 compiler against Xcode 26's MacOSX26.5.sdk cannot parse the SDK
      # module maps. Selecting an Xcode gives a matched compiler + SDK pair.
      - name: Select Xcode ${{ matrix.xcode }}
        if: matrix.xcode != ''
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      # Diagnostics only - must never gate the build. Note the explicit
      # `--sdk macosx`: a bare `xcrun --show-sdk-version` resolves via the
      # CommandLineTools symlink, which is missing on some runner images.
      - name: Toolchain versions
        continue-on-error: true
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk macosx --show-sdk-version

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test --enable-code-coverage

      - name: Prepare Code Coverage
        if: matrix.coverage
        run: |
          BIN_PATH="$(swift build --show-bin-path)"
          xcrun llvm-cov export -format="lcov" \
            "${BIN_PATH}/GOFeatureFlagPackageTests.xctest/Contents/MacOS/GOFeatureFlagPackageTests" \
            -instr-profile "${BIN_PATH}/codecov/default.profdata" > info.lcov

      - name: Upload coverage reports to Codecov
        if: matrix.coverage
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          files: info.lcov

  build-ios:
    # Deliberately unpinned. Xcode 26 downloads its device platforms
    # separately, and the runner image only installs them for the image's
    # default Xcode. Pinning a non-default version (we pinned 26.0.1) gives
    # runners where iOS/tvOS/watchOS/visionOS are all missing and only macOS
    # destinations exist, so `generic/platform=iOS` fails to resolve.
    # Version coverage is the build-test matrix's job; this is a compile check.
    name: iOS build (default Xcode)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show available SDKs
        continue-on-error: true
        run: |
          xcodebuild -version
          xcodebuild -showsdks
      - name: Build for iOS
        run: |
          xcodebuild build \
            -scheme GOFeatureFlag \
            -destination 'generic/platform=iOS'

  # `testConcurrentEvaluationAndBackgroundRefreshIsRaceFree` in
  # Tests/OFREPTests/provider_tests.swift only proves the provider's state lock
  # removes the cache/context data race when a race detector is actually watching.
  # Without this job it passes trivially. The whole suite runs (no --filter) so a
  # race anywhere is caught, not just the one that motivated the lock.
  #
  # NOTE: this must be xcodebuild, not `swift test --sanitize=thread`. SwiftPM runs
  # XCTest bundles by dlopen'ing them into Apple's `xctest` host, which is not
  # instrumented, so TSan's interceptors never install and the runner dies with
  # SIGSEGV ("Interceptors are not working ... ThreadSanitizer is loaded too late").
  # Inserting the runtime by hand with DYLD_INSERT_LIBRARIES is refused outright on
  # macOS 26 ("Sanitizer load violates platform policy"). xcodebuild builds an
  # instrumented test runner and wires the environment up itself.
  thread-sanitizer:
    name: ThreadSanitizer
    runs-on: macos-15
    # TSan slows every memory access; the stress test alone does 8x2000 concurrent
    # reads against a 10ms polling timer. Bound it so a hang cannot burn a runner.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Run tests under ThreadSanitizer
        env:
          # xcodebuild forwards TEST_RUNNER_-prefixed variables to the test host with
          # the prefix stripped. That is the only reliable way to reach the runner's
          # environment here: TSAN_OPTIONS would otherwise have to live in the scheme's
          # test action, and this scheme is generated by SwiftPM.
          #
          # halt_on_error=0 lets the whole suite run instead of aborting on the first
          # report (which previously cascaded into 28 "failures" from one root cause);
          # exitcode=66 still fails the job if any unsuppressed race is found, so this
          # stays a real gate.
          TEST_RUNNER_TSAN_OPTIONS: >-
            suppressions=${{ github.workspace }}/.tsan-suppressions.txt
            halt_on_error=0
            exitcode=66
        run: |
          xcodebuild test \
            -scheme GOFeatureFlag-Package \
            -destination 'platform=macOS' \
            -enableThreadSanitizer YES

  lint:
    name: Swift Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: norio-nomura/action-swiftlint@3.2.1

  # Single stable status check for branch protection. Adding or removing a
  # matrix entry then never requires touching the required-checks config.
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [build-test, build-ios, lint, thread-sanitizer]
    if: always()
    steps:
      - name: Fail if any required job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All required CI jobs passed."
