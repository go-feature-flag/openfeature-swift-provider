name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

# Never run two release-please passes against main at once: both would try to
# reconcile the same release PR and the loser force-pushes a stale branch.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    steps:
      # A PAT, not GITHUB_TOKEN. main requires "CI Success", "Swift Lint" and the
      # two codecov checks, and GitHub deliberately does not trigger workflows for
      # events raised by GITHUB_TOKEN. A GITHUB_TOKEN-authored release PR would
      # therefore show zero checks and could only be merged by an admin bypass.
      #
      # RELEASE_PLEASE_TOKEN is a fine-grained PAT scoped to this repo with
      # Contents: read/write and Pull requests: read/write.
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
